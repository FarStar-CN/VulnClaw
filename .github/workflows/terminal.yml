name: Terminal artifacts

on:
  workflow_call:

permissions:
  contents: read

jobs:
  terminal:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            suffix: ''
          - os: windows-latest
            platform: windows-x64
            suffix: .exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: python -m pip install -e '.[dev]'
      - name: Lock dependencies and check protocol/types
        working-directory: tui
        run: |
          bun install --frozen-lockfile
          bun run generate --check
          bun run typecheck
      - name: Native renderer and real Python transport tests
        working-directory: tui
        run: |
          export VULNCLAW_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          bun test
      - name: Build standalone executable
        working-directory: tui
        run: |
          bun run build --outfile dist/vulnclaw-terminal-${{ matrix.platform }}${{ matrix.suffix }}
      - uses: actions/upload-artifact@v4
        with:
          name: vulnclaw-terminal-${{ matrix.platform }}
          path: tui/dist/vulnclaw-terminal-${{ matrix.platform }}${{ matrix.suffix }}
